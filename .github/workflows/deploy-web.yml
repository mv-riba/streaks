# Builds the Streaks web app and publishes it to GitHub Pages on every push to main.
# Needs one repository variable (Settings → Secrets and variables → Actions → Variables):
#   EXPO_PUBLIC_NEON_URL  (https://<endpoint>.<cell>.<region>.aws.neon.tech/<database>)
name: Deploy web

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build website
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_NEON_URL: ${{ vars.EXPO_PUBLIC_NEON_URL }}

      # GitHub Pages has no "send every path to index.html" setting; serving the app as
      # the 404 page makes links like /streak/123 work when opened or refreshed directly.
      - name: Single-page-app fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
